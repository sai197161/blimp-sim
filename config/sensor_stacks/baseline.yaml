# The original hand-written model (models/blimp/model.sdf) expressed as a stack, for A/B comparison.
# Note: a real 16-channel 3D lidar weighs 250 g or more, far beyond this hull's lift. The mass here only
# reproduces the original model's 40 g gondola.
name: baseline
description: original model - mono front camera, down camera, down rangefinder, 16-ch 3D lidar, IMU
gondola_base_mass: 0.025
hull: {auto_scale: false, scale: 1.0}
sensors:
  - {name: imu, type: imu, mount: gondola, pose: [0, 0, 0, 0, 0, 0], mass: 0.0}
  - {name: front_camera, type: camera, mount: gondola, pose: [0.07, 0, 0, 0, 0, 0], mass: 0.003}
  - {name: down_camera, type: camera, mount: gondola, pose: [0, 0, -0.03, 0, 1.5708, 0],
     width: 160, height: 160, hfov: 0.733, format: L8, noise_std: 0, mass: 0.003}
  - {name: range, type: tof, mount: gondola, pose: [0, 0.03, -0.03, 0, 1.5708, 0], range: [0.04, 4.0], mass: 0.002}
  - {name: lidar, type: lidar_3d, mount: gondola, pose: [0.05, 0, 0.035, 0, 0, 0], mass: 0.007}
